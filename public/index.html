<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal Link Optimizer</title>
    <style>
      :root {
        --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
        --text: #e7eaf0; --muted: #97a0b0; --accent: #6ea8fe; --accent-2: #7ee787;
        --danger: #ff7b72; --radius: 12px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
      .wrap { max-width: 900px; margin: 0 auto; padding: 36px 20px 80px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 22px; }
      .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
      .tab { padding: 9px 16px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
      .tab.active { color: var(--text); border-bottom-color: var(--accent); }
      form, .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
      label { display: block; font-weight: 600; margin: 0 0 6px; font-size: 13px; }
      .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
      textarea, input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit; margin-bottom: 16px; resize: vertical; }
      textarea { min-height: 90px; }
      textarea:focus, input:focus { outline: none; border-color: var(--accent); }
      .field-row { display: flex; gap: 14px; flex-wrap: wrap; }
      .field-row > div { flex: 1; min-width: 160px; }
      button { background: var(--accent); color: #08131f; border: 0; border-radius: 8px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); padding: 7px 12px; font-weight: 600; }
      .steps { margin: 24px 0 0; }
      .step { display: flex; gap: 12px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--panel); align-items: flex-start; }
      .dot { flex: 0 0 20px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); margin-top: 2px; position: relative; }
      .step.running .dot { border-color: var(--accent); animation: pulse 1s infinite; }
      .step.done .dot { border-color: var(--accent-2); background: var(--accent-2); }
      .step.done .dot::after { content: "✓"; position: absolute; inset: -3px 0 0 0; text-align: center; color: #08131f; font-size: 12px; font-weight: 900; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
      .step-title { font-weight: 600; font-size: 14px; }
      .step-detail { color: var(--muted); font-size: 13px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
      .card { margin-bottom: 16px; }
      .card h2 { font-size: 15px; margin: 0 0 12px; }
      .pill { display: inline-block; background: var(--panel-2); border: 1px solid var(--border); color: var(--accent); padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
      .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
      .muted { color: var(--muted); }
      .warn { color: var(--danger); }
      .prop { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
      .prop:last-child { border-bottom: 0; }
      .prop input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; flex: 0 0 auto; accent-color: var(--accent); }
      .prop-main { flex: 1; min-width: 0; }
      .prop a { color: var(--accent); word-break: break-all; text-decoration: none; }
      .prop a:hover { text-decoration: underline; }
      .anchor { color: var(--accent-2); font-weight: 600; }
      .ctx { color: var(--muted); font-size: 13px; margin-top: 4px; }
      .ctx mark { background: rgba(126,231,135,0.22); color: var(--accent-2); padding: 0 2px; border-radius: 3px; }
      pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow: auto; max-height: 420px; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
      .preview { background: #fff; color: #111; border-radius: 8px; padding: 16px 20px; max-height: 420px; overflow: auto; }
      .preview a { color: #1a56db; }
      .otabs { display: flex; gap: 6px; margin-bottom: 10px; }
      .otab { padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; cursor: pointer; font-size: 12px; color: var(--muted); font-weight: 600; }
      .otab.active { color: var(--text); border-color: var(--accent); }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      td a { color: var(--accent); text-decoration: none; word-break: break-all; }
      .status-ok { color: var(--accent-2); } .status-err { color: var(--danger); } .status-run { color: var(--accent); }
      .hide { display: none; }
      .row-list div { padding: 8px 0; border-bottom: 1px solid var(--border); }
      .row-list div:last-child { border-bottom: 0; }
      .reason { color: var(--muted); font-size: 12px; margin-top: 3px; font-style: italic; }
      .conf { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-left: 6px; text-transform: uppercase; letter-spacing: .02em; }
      .conf.high { color: var(--accent-2); border: 1px solid rgba(126,231,135,.45); }
      .conf.medium { color: var(--accent); border: 1px solid rgba(110,168,254,.45); }
      .conf.low { color: var(--muted); border: 1px solid var(--border); }
      .swap { margin-top: 7px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 12px; max-width: 100%; }
      .swap-label { color: var(--muted); font-size: 11px; margin-right: 4px; }
      .preview.hl a.ins { background: #ffe08a; box-shadow: 0 0 0 2px #ffe08a; border-radius: 2px; font-weight: 600; }
      .caret { display: inline-block; width: 14px; color: var(--muted); cursor: pointer; user-select: none; }
      tr.bexp { cursor: pointer; }
      tr.detail > td { background: var(--panel-2); }
      tr.detail .anchor { color: var(--accent-2); }
      tr.detail a { color: var(--accent); text-decoration: none; word-break: break-all; }
      .loader-overlay { position: fixed; inset: 0; background: rgba(15, 17, 21, 0.8); display: flex; align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(2px); }
      .loader-overlay.hide { display: none; }
      .loader-content { text-align: center; }
      .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 24px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loader-text { color: var(--muted); font-size: 13px; font-weight: 500; margin-bottom: 20px; }
      .progress-bar { width: 200px; height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin: 0 auto; }
      .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; width: 0%; transition: width 0.3s ease; box-shadow: 0 0 12px rgba(110, 168, 254, 0.4); }
    </style>
  </head>
  <body>
    <div id="loader" class="loader-overlay hide">
      <div class="loader-content">
        <div class="spinner"></div>
        <div class="loader-text" id="loader-text">Optimizing...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>
    <div class="wrap">
      <h1>Internal Link Optimizer</h1>
      <p class="sub">Finds relevant internal links for an article, lets you approve them, and inserts them without changing a word of your prose.</p>

      <div class="tabs">
        <div class="tab active" data-mode="single">Single</div>
        <div class="tab" data-mode="batch">Batch</div>
        <div class="tab" data-mode="history">History</div>
      </div>

      <!-- SINGLE -->
      <section id="mode-single">
        <form id="form">
          <label for="article">Article <span class="hint">— a published URL, or paste the raw content/markdown</span></label>
          <textarea id="article" placeholder="https://yourdomain.com/blog/the-post  —  or paste the article text"></textarea>
          <div class="field-row">
            <div>
              <label for="domain">Your domain <span class="hint">— e.g. tryprofound.com</span></label>
              <input id="domain" placeholder="yourdomain.com" />
            </div>
            <div>
              <label for="maxLinks">Max links <span class="hint">— blank = auto by length</span></label>
              <input id="maxLinks" type="number" min="1" max="20" placeholder="auto" />
            </div>
          </div>
          <button id="run" type="submit">Optimize links</button>
        </form>
        <div class="steps hide" id="steps"></div>
        <div id="results"></div>
      </section>

      <!-- BATCH -->
      <section id="mode-batch" class="hide">
        <form id="batch-form">
          <label for="batch-urls">Article URLs <span class="hint">— one per line</span></label>
          <textarea id="batch-urls" style="min-height:120px" placeholder="https://yourdomain.com/blog/post-1&#10;https://yourdomain.com/blog/post-2"></textarea>
          <div class="field-row">
            <div>
              <label for="batch-domain">Your domain</label>
              <input id="batch-domain" placeholder="yourdomain.com" />
            </div>
            <div>
              <label for="batch-maxLinks">Max links / article</label>
              <input id="batch-maxLinks" type="number" min="1" max="20" placeholder="auto" />
            </div>
          </div>
          <button id="batch-run" type="submit">Run batch</button>
        </form>
        <div id="batch-results" style="margin-top:20px"></div>
      </section>

      <!-- HISTORY -->
      <section id="mode-history" class="hide">
        <div class="card">
          <div class="bar"><h2 style="margin:0">Run history</h2><button class="ghost" id="history-refresh" type="button">Refresh</button></div>
          <div id="history-list" style="margin-top:12px"></div>
        </div>
        <div id="history-detail"></div>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      // ---- Mode tabs ----
      document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
        const mode = t.dataset.mode;
        for (const m of ["single", "batch", "history"]) $("mode-" + m).classList.toggle("hide", m !== mode);
        if (mode === "history") loadHistory();
      }));

      // ---- SSE reader ----
      async function readSSE(res, onEvent) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop();
          for (const part of parts) {
            const line = part.replace(/^data: /, "").trim();
            if (line) onEvent(JSON.parse(line));
          }
        }
      }

      // ======================= SINGLE =======================
      const STEP_TITLES = ["Fetch & parse article","Summarize article","Find linkable phrases","Get sitemap","Match links to pages","Insert & verify","Reverse link suggestions"];
      let currentRun = null;

      function renderSteps(state) {
        $("steps").classList.remove("hide");
        $("steps").innerHTML = STEP_TITLES.map((t, i) => {
          const s = state[i + 1] || {};
          const cls = s.status === "done" ? "done" : s.status === "running" ? "running" : "";
          return `<div class="step ${cls}"><div class="dot"></div><div><div class="step-title">${i + 1}. ${t}</div>${s.detail ? `<div class="step-detail">${esc(s.detail)}</div>` : ""}</div></div>`;
        }).join("");
        updateProgressBar(state);
      }

      function updateProgressBar(state) {
        const completedSteps = Object.values(state).filter(s => s && s.status === "done").length;
        const totalSteps = STEP_TITLES.length;
        const progress = (completedSteps / totalSteps) * 100;
        const fill = $("progress-fill");
        if (fill) fill.style.width = progress + "%";
      }

      function highlight(context, anchor) {
        const e = esc(context); const a = esc(anchor);
        return a && e.includes(a) ? e.replace(a, `<mark>${a}</mark>`) : e;
      }

      function selectedEdits() {
        return [...document.querySelectorAll(".prop input:checked")].map((c) => ({ anchor: c.dataset.anchor, url: c.dataset.url }));
      }

      function renderResults(r) {
        currentRun = r;
        const cands = r.candidatePages || [];
        const optsFor = (url) => cands.map((c) => `<option value="${esc(c.url)}" ${c.url === url ? "selected" : ""}>${esc(c.title || c.url)}</option>`).join("");
        const proposedRows = r.proposed.length ? r.proposed.map((p, i) => {
          const conf = p.confidence || "medium";
          return `
          <div class="prop">
            <input type="checkbox" ${conf === "low" ? "" : "checked"} data-anchor="${esc(p.anchor)}" data-url="${esc(p.url)}" />
            <div class="prop-main">
              <div><span class="anchor">${esc(p.anchor)}</span> → <a class="tgt" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title || p.url)}</a> <span class="conf ${esc(conf)}">${esc(conf)}</span></div>
              ${p.reason ? `<div class="reason">${esc(p.reason)}</div>` : ""}
              ${p.context ? `<div class="ctx">${highlight(p.context, p.anchor)}</div>` : ""}
              ${cands.length ? `<div><span class="swap-label">target:</span><select class="swap" data-row="${i}">${optsFor(p.url)}</select></div>` : ""}
            </div>
          </div>`;
        }).join("") : `<div class="muted">No relevant internal links were found for this article.</div>`;

        const reverseRows = r.reverse && r.reverse.length ? `
          <div class="card"><h2>Pages that could link back here <span class="pill">${r.reverse.length}</span></h2>
          <div class="row-list">${r.reverse.map((v) => `<div><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title || v.url)}</a><div class="muted">${esc(v.reason || "")}${v.anchorConcept ? ` · suggested anchor: <span class="anchor">${esc(v.anchorConcept)}</span>` : ""}</div></div>`).join("")}</div></div>` : "";

        $("results").innerHTML = `
          <div class="card">
            <div class="bar"><h2 style="margin:0">Summary</h2><span class="pill">${esc(r.keyword)}</span></div>
            <div class="muted" style="font-size:13px;margin-top:10px">${esc(r.summary)}</div>
            <div class="muted" style="font-size:12px;margin-top:8px">${r.wordCount} words · target ≤ ${r.targetMax} links${r.warning ? ` · <span class="warn">⚠ ${esc(r.warning)}</span>` : ""}</div>
          </div>

          <div class="card">
            <div class="bar"><h2 style="margin:0">Proposed links</h2>
              <button id="applyBtn" type="button">Apply selected</button>
            </div>
            <div class="muted" style="font-size:12px;margin:2px 0 10px">Uncheck any you don't want, then Apply. Inserting never changes your prose.</div>
            ${proposedRows}
          </div>

          ${reverseRows}
          <div id="output"></div>`;

        $("applyBtn") && ($("applyBtn").onclick = applySelected);

        // Swap-target dropdowns: update the row's checkbox url + displayed link.
        document.querySelectorAll(".prop").forEach((row) => {
          const sel = row.querySelector(".swap");
          const cb = row.querySelector('input[type=checkbox]');
          const link = row.querySelector("a.tgt");
          if (sel) sel.onchange = () => {
            cb.dataset.url = sel.value;
            const opt = sel.options[sel.selectedIndex];
            link.href = sel.value;
            link.textContent = opt.textContent;
          };
        });

        renderOutput({ updatedArticle: r.updatedArticle, updatedHtml: r.updatedHtml, added: r.added, skipped: r.skipped, driftOk: r.driftOk });

        // If low-confidence links started unchecked, sync the output to match.
        if (selectedEdits().length !== r.proposed.length) applySelected();
      }

      async function applySelected() {
        const edits = selectedEdits();
        $("applyBtn").disabled = true; $("applyBtn").textContent = "Applying…";
        try {
          const res = await fetch("/api/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ originalArticle: currentRun.originalArticle, edits }) });
          renderOutput(await res.json());
        } finally {
          $("applyBtn").disabled = false; $("applyBtn").textContent = "Apply selected";
        }
      }

      function renderOutput(o) {
        const drift = o.driftOk ? `<span class="pill" style="color:var(--accent-2)">prose unchanged ✓</span>` : `<span class="pill" style="color:var(--danger)">⚠ prose changed — do not publish</span>`;
        window._md = o.updatedArticle; window._html = o.updatedHtml || "";
        $("output").innerHTML = `
          <div class="card">
            <div class="bar"><h2 style="margin:0">Result — ${o.added.length} links inserted ${drift}</h2></div>
            <div class="otabs"><div class="otab active" data-o="md">Markdown</div>${o.updatedHtml ? `<div class="otab" data-o="html">Preview</div>` : ""}
              ${o.updatedHtml ? `<button class="ghost" id="hlBtn" type="button">Highlight added</button>` : ""}
              <div style="flex:1"></div>
              <button class="ghost" id="copyMd" type="button">Copy MD</button>
              ${o.updatedHtml ? `<button class="ghost" id="copyHtml" type="button">Copy HTML</button>` : ""}
              <button class="ghost" id="dlMd" type="button">Download</button>
            </div>
            <pre id="out-md">${esc(o.updatedArticle)}</pre>
            ${o.updatedHtml ? `<div id="out-html" class="preview hide">${o.updatedHtml}</div>` : ""}
          </div>`;
        document.querySelectorAll(".otab").forEach((t) => t.onclick = () => {
          document.querySelectorAll(".otab").forEach((x) => x.classList.toggle("active", x === t));
          $("out-md").classList.toggle("hide", t.dataset.o !== "md");
          $("out-html") && $("out-html").classList.toggle("hide", t.dataset.o !== "html");
        });
        $("copyMd").onclick = () => { navigator.clipboard.writeText(window._md); $("copyMd").textContent = "Copied ✓"; };
        if ($("copyHtml")) $("copyHtml").onclick = () => { navigator.clipboard.writeText(window._html); $("copyHtml").textContent = "Copied ✓"; };
        $("dlMd").onclick = () => { const b = new Blob([window._md], { type: "text/markdown" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "article-with-links.md"; a.click(); };

        // Mark the inserted links inside the Preview so they can be highlighted.
        if ($("out-html")) {
          const addedUrls = new Set((o.added || []).map((a) => a.url));
          $("out-html").querySelectorAll("a").forEach((a) => { if (addedUrls.has(a.getAttribute("href"))) a.classList.add("ins"); });
        }
        if ($("hlBtn")) $("hlBtn").onclick = () => {
          document.querySelectorAll(".otab").forEach((x) => x.classList.toggle("active", x.dataset.o === "html"));
          $("out-md").classList.add("hide"); $("out-html").classList.remove("hide");
          const on = $("out-html").classList.toggle("hl");
          $("hlBtn").textContent = on ? "Unhighlight" : "Highlight added";
        };
      }

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const article = $("article").value.trim(), domain = $("domain").value.trim();
        const maxLinks = $("maxLinks").value.trim();
        if (!article || !domain) return;
        const btn = $("run"); btn.disabled = true; btn.textContent = "Working…";
        $("results").innerHTML = ""; const state = {}; renderSteps(state);
        $("loader").classList.remove("hide"); $("loader-text").textContent = "Analyzing article…"; $("progress-fill").style.width = "0%";
        try {
          const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ article, domain, maxLinks: maxLinks || undefined }) });
          await readSSE(res, (evt) => {
            if (evt.type === "step") { state[evt.step] = evt; renderSteps(state); }
            else if (evt.type === "done") renderResults(evt.result);
            else if (evt.type === "error") $("results").innerHTML = `<div class="card"><h2 class="warn">Error</h2><div>${esc(evt.message)}</div></div>`;
          });
        } catch (err) { $("results").innerHTML = `<div class="card"><h2 class="warn">Error</h2><div>${esc(err.message)}</div></div>`; }
        finally { btn.disabled = false; btn.textContent = "Optimize links"; $("loader").classList.add("hide"); }
      });

      // ======================= BATCH =======================
      let batchRows = [];
      $("batch-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const urls = $("batch-urls").value.trim(), domain = $("batch-domain").value.trim();
        const maxLinks = $("batch-maxLinks").value.trim();
        if (!urls || !domain) return;
        const btn = $("batch-run"); btn.disabled = true; btn.textContent = "Working…";
        batchRows = [];
        $("batch-results").innerHTML = `<div class="card"><div class="bar"><h2 style="margin:0">Results</h2><button class="ghost" id="csvBtn" type="button">Export CSV</button></div><div style="overflow-x:auto"><table id="batch-table"><thead><tr><th>#</th><th>Article</th><th>Title</th><th>Links</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>`;
        $("csvBtn").onclick = exportCsv;
        const tbody = $("batch-table").querySelector("tbody");
        const upsert = (i, html) => { let tr = tbody.querySelector(`tr[data-i="${i}"]`); if (!tr) { tr = document.createElement("tr"); tr.dataset.i = i; tbody.appendChild(tr); } tr.innerHTML = html; };
        $("loader").classList.remove("hide"); $("loader-text").textContent = "Processing batch…"; $("progress-fill").style.width = "0%";
        try {
          const res = await fetch("/api/batch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ urls, domain, maxLinks: maxLinks || undefined }) });
          await readSSE(res, (evt) => {
            if (evt.type === "item-start") upsert(evt.index, `<td>${evt.index + 1}</td><td><a href="${esc(evt.article)}" target="_blank">${esc(shorten(evt.article))}</a></td><td class="muted">…</td><td>…</td><td class="status-run">running</td>`);
            else if (evt.type === "item-done") {
              batchRows[evt.index] = evt;
              const n = evt.added.length;
              upsert(evt.index, `<td><span class="caret">${n ? "▸" : ""}</span> ${evt.index + 1}</td><td><a href="${esc(evt.article)}" target="_blank">${esc(shorten(evt.article))}</a></td><td class="muted">${esc(evt.title || "")}</td><td><b>${n}</b></td><td class="status-ok">${evt.driftOk ? "done ✓" : "done ⚠"}</td>`);
              const tr = tbody.querySelector(`tr[data-i="${evt.index}"]`);
              if (n && tr) { tr.classList.add("bexp"); tr.onclick = (e) => { if (e.target.closest("a")) return; toggleBatchDetail(evt.index); }; }
            }
            else if (evt.type === "item-error") upsert(evt.index, `<td>${evt.index + 1}</td><td><a href="${esc(evt.article)}" target="_blank">${esc(shorten(evt.article))}</a></td><td colspan="2" class="warn">${esc(evt.message)}</td><td class="status-err">error</td>`);
            else if (evt.type === "error") $("batch-results").innerHTML = `<div class="card"><h2 class="warn">Error</h2><div>${esc(evt.message)}</div></div>`;
          });
        } catch (err) { $("batch-results").innerHTML += `<div class="card warn">${esc(err.message)}</div>`; }
        finally { btn.disabled = false; btn.textContent = "Run batch"; $("loader").classList.add("hide"); }
      });
      const shorten = (u) => u.replace(/^https?:\/\/(www\.)?/, "").slice(0, 60);
      function toggleBatchDetail(i) {
        const tbody = $("batch-table").querySelector("tbody");
        const tr = tbody.querySelector(`tr[data-i="${i}"]`);
        if (!tr) return;
        const caret = tr.querySelector(".caret");
        const existing = tbody.querySelector(`tr.detail[data-for="${i}"]`);
        if (existing) { existing.remove(); if (caret) caret.textContent = "▸"; return; }
        const r = batchRows[i]; if (!r) return;
        const det = document.createElement("tr"); det.className = "detail"; det.dataset.for = i;
        det.innerHTML = `<td></td><td colspan="4">${r.added.map((a) => `<div style="padding:4px 0"><span class="anchor">${esc(a.anchor)}</span> → <a href="${esc(a.url)}" target="_blank">${esc(a.title || a.url)}</a></div>`).join("") || '<span class="muted">no links</span>'}</td>`;
        tr.after(det);
        if (caret) caret.textContent = "▾";
      }
      function exportCsv() {
        const rows = [["url", "title", "links_added", "anchors"]];
        batchRows.filter(Boolean).forEach((r) => rows.push([r.article, r.title || "", r.added.length, r.added.map((a) => `${a.anchor} -> ${a.url}`).join(" | ")]));
        const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
        const b = new Blob([csv], { type: "text/csv" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "internal-links-batch.csv"; a.click();
      }

      // ======================= HISTORY =======================
      async function loadHistory() {
        $("history-detail").innerHTML = "";
        const runs = await (await fetch("/api/history")).json();
        $("history-list").innerHTML = runs.length ? `<div class="row-list">${runs.map((r) => `<div style="cursor:pointer" data-id="${esc(r.id)}"><b>${esc(r.title || r.url || "(run)")}</b> <span class="pill">${r.addedCount} links</span><div class="muted">${esc(r.domain || "")} · ${esc((r.date || "").slice(0, 16).replace("T", " "))}</div></div>`).join("")}</div>` : `<div class="muted">No runs saved yet.</div>`;
        document.querySelectorAll("#history-list [data-id]").forEach((el) => el.onclick = () => openRun(el.dataset.id));
      }
      async function openRun(id) {
        const run = await (await fetch("/api/history/" + id)).json();
        const r = run.result || {};
        $("history-detail").innerHTML = `<div class="card"><div class="bar"><h2 style="margin:0">${esc(r.title || run.input?.article || "")}</h2><span class="pill">${esc(r.keyword || "")}</span></div>
          <div class="muted" style="font-size:12px;margin-top:8px">${esc(run.input?.article || "")}</div>
          <h2 style="margin-top:16px">Links added (${(r.added || []).length})</h2>
          <div class="row-list">${(r.added || []).map((a) => `<div><span class="anchor">${esc(a.anchor)}</span> → <a href="${esc(a.url)}" target="_blank">${esc(a.title || a.url)}</a></div>`).join("") || '<div class="muted">none</div>'}</div>
          <h2 style="margin-top:16px">Updated article</h2><pre>${esc(r.updatedArticle || "")}</pre></div>`;
      }
      $("history-refresh").onclick = loadHistory;
    </script>
  </body>
</html>
